<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 { font-size: 16px; font-weight: 600; color: #111; }
    header span { font-size: 11px; color: #888; }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }

    .field input[type="text"] {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }

    .field input[type="text"]:focus { border-color: #4a90e2; }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #4a90e2;
    }

    .slider-val {
      font-size: 13px;
      font-weight: 600;
      color: #4a90e2;
      width: 24px;
      text-align: right;
    }

    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #4a90e2;
      color: #fff;
    }

    .btn:hover { background: #3a7fd0; }
    .btn:disabled { background: #a0c0e8; cursor: not-allowed; }

    .btn-stop { background: #e25555; display: none; }
    .btn-stop:hover { background: #cc3c3c; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      text-align: center;
    }

    .stat-box .num { font-size: 22px; font-weight: 700; color: #111; }
    .stat-box .lbl { font-size: 11px; color: #888; margin-top: 2px; }

    /* thread activity bar */
    .thread-bar-wrap {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px 10px;
    }

    .thread-bar-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .thread-dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ddd;
      transition: background 0.2s;
    }

    .dot.busy { background: #4a90e2; }

    #status {
      font-size: 12px;
      color: #888;
      word-break: break-all;
      min-height: 16px;
    }

    #status.active { color: #4a90e2; }
    #status.done   { color: #27ae60; }
    #status.error  { color: #e25555; }

    .results-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-toolbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }

    .filter-input {
      margin-left: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      width: 200px;
      outline: none;
    }

    .filter-input:focus { border-color: #4a90e2; }

    #results-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px 12px;
    }

    .result-card .dork-tag {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-card .title { font-size: 14px; font-weight: 600; color: #1a0dab; margin-bottom: 2px; }

    .result-card .link {
      font-size: 12px;
      color: #27ae60;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .result-card .link:hover { text-decoration: underline; }
    .result-card .snippet { font-size: 13px; color: #555; line-height: 1.5; }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>

<header>
  <h1>Google Dorking Tool</h1>
  <span>GHDB / Exploit-DB</span>
</header>

<div class="main">

  <aside class="sidebar">
    <div class="field">
      <label>Domain</label>
      <input type="text" id="domain" placeholder="example.com" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label>Parallel workers</label>
      <div class="slider-row">
        <input type="range" id="workers" min="1" max="20" value="5"
               oninput="document.getElementById('workers-val').textContent = this.value; rebuildDots();">
        <span class="slider-val" id="workers-val">5</span>
      </div>
    </div>

    <button class="btn" id="btn-start" onclick="startSearch()">Run Dorks</button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopSearch()">Stop</button>

    <div class="stats">
      <div class="stat-box">
        <div class="num" id="stat-dorks">0</div>
        <div class="lbl">Dorks ran</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-results">0</div>
        <div class="lbl">Results</div>
      </div>
    </div>

    <div class="thread-bar-wrap">
      <div class="thread-bar-label">
        <span>Workers</span>
        <span id="busy-count">0 / 0 active</span>
      </div>
      <div class="thread-dots" id="thread-dots"></div>
    </div>

    <div id="status">Awaiting target...</div>
  </aside>

  <section class="results-panel">
    <div class="results-toolbar">
      <span id="toolbar-count">0 results</span>
      <input class="filter-input" type="text" id="filter" placeholder="Filter results..." oninput="filterResults()">
    </div>
    <div id="results-list">
      <div class="empty-state" id="empty-state">Enter a domain and click Run Dorks</div>
    </div>
  </section>

</div>

<script>
  let evtSource   = null;
  let allCards    = [];
  let dorkCount   = 0;
  let resultCount = 0;
  let busyWorkers = 0;

  // Build worker dots from slider value
  function rebuildDots() {
    const n = parseInt(document.getElementById('workers').value);
    const wrap = document.getElementById('thread-dots');
    wrap.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.id = `dot-${i}`;
      wrap.appendChild(d);
    }
    document.getElementById('busy-count').textContent = `0 / ${n} active`;
  }

  function setWorkerBusy(busy) {
    const n = parseInt(document.getElementById('workers').value);
    busyWorkers = Math.min(busy, n);
    document.getElementById('busy-count').textContent = `${busyWorkers} / ${n} active`;
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('busy', i < busyWorkers);
    });
  }

  function startSearch() {
    const domain  = document.getElementById('domain').value.trim();
    const workers = document.getElementById('workers').value;
    if (!domain) { setStatus('error', 'Enter a domain first.'); return; }

    allCards = []; dorkCount = 0; resultCount = 0; busyWorkers = 0;
    document.getElementById('stat-dorks').textContent   = '0';
    document.getElementById('stat-results').textContent = '0';
    document.getElementById('results-list').innerHTML   = '';
    document.getElementById('toolbar-count').textContent = '0 results';
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').style.display = 'block';
    rebuildDots();
    setStatus('active', 'Connecting...');

    if (evtSource) evtSource.close();
    evtSource = new EventSource(`/search?domain=${encodeURIComponent(domain)}&workers=${workers}`);

    evtSource.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === 'dork') {
        dorkCount++;
        document.getElementById('stat-dorks').textContent = dorkCount;
        setWorkerBusy(busyWorkers + 1);
        setStatus('active', data.dork);

      } else if (data.type === 'result') {
        resultCount++;
        document.getElementById('stat-results').textContent = resultCount;
        document.getElementById('toolbar-count').textContent =
          `${resultCount} result${resultCount !== 1 ? 's' : ''}`;
        addCard(data);

      } else if (data.type === 'search_error') {
        setWorkerBusy(Math.max(0, busyWorkers - 1));

      } else if (data.type === 'done') {
        setWorkerBusy(0);
        setStatus('done', `Done — ${data.dorks} dorks, ${data.results} results`);
        cleanup();

      } else if (data.error) {
        setStatus('error', data.error);
        cleanup();
      }
    };

    evtSource.onerror = () => {
      setStatus('error', 'Stream error or server disconnected.');
      cleanup();
    };
  }

  function stopSearch() {
    if (evtSource) evtSource.close();
    setWorkerBusy(0);
    setStatus('done', 'Stopped.');
    cleanup();
  }

  function cleanup() {
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').style.display = 'none';
  }

  function addCard(data) {
    const list  = document.getElementById('results-list');
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    const card = document.createElement('div');
    card.className   = 'result-card';
    card.dataset.text = `${data.title} ${data.link} ${data.snippet} ${data.dork}`.toLowerCase();
    card.innerHTML = `
      <div class="dork-tag">${esc(data.dork)}</div>
      <div class="title">${esc(data.title)}</div>
      <a class="link" href="${esc(data.link)}" target="_blank" rel="noopener">${esc(data.link)}</a>
      ${data.snippet ? `<div class="snippet">${esc(data.snippet)}</div>` : ''}
    `;
    allCards.push(card);
    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
    applyFilter();
  }

  function filterResults() { applyFilter(); }

  function applyFilter() {
    const q = document.getElementById('filter').value.toLowerCase();
    let visible = 0;
    allCards.forEach(c => {
      const show = !q || c.dataset.text.includes(q);
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('toolbar-count').textContent =
      `${visible} result${visible !== 1 ? 's' : ''}${q ? ' (filtered)' : ''}`;
  }

  function setStatus(type, msg) {
    const el = document.getElementById('status');
    el.className  = type;
    el.textContent = msg;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('domain').addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });

  // init dots on load
  rebuildDots();
</script>

</body>
</html>
