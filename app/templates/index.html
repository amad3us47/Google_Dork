<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #0f1318;
      --border: #1e2530;
      --accent: #00ff88;
      --accent2: #0af;
      --warn: #ff4560;
      --text: #c8d8e8;
      --muted: #4a5a6a;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,136,0.015) 2px,
        rgba(0,255,136,0.015) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      padding: 2rem 2.5rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    header h1 span { color: var(--accent); }

    .badge {
      font-family: var(--mono);
      font-size: 0.65rem;
      background: rgba(0,255,136,0.1);
      color: var(--accent);
      border: 1px solid rgba(0,255,136,0.3);
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.1em;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
    }

    /* --- Sidebar --- */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
    }

    .field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 0.65rem 0.9rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #000;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-stop {
      background: var(--warn);
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.9rem;
    }

    .stat-box .num {
      font-family: var(--mono);
      font-size: 1.6rem;
      color: #fff;
      line-height: 1;
    }

    .stat-box .lbl {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .status-line {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      min-height: 1.2em;
      word-break: break-all;
    }

    .status-line.active { color: var(--accent); }
    .status-line.done   { color: var(--accent2); }
    .status-line.error  { color: var(--warn); }

    /* Pulse dot */
    .pulse {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      animation: pulse 1s infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* --- Results panel --- */
    .results-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-toolbar {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .filter-input {
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      border-radius: 3px;
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }

    .filter-input:focus { border-color: var(--accent2); }
    .filter-input::placeholder { color: var(--muted); }

    #results-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #results-list::-webkit-scrollbar { width: 5px; }
    #results-list::-webkit-scrollbar-track { background: transparent; }
    #results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1rem 1.2rem;
      animation: slideIn 0.25s ease;
      transition: border-color 0.2s;
    }

    .result-card:hover { border-color: var(--accent2); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-card .dork-tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-card .title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent2);
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .result-card .link {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--accent);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.4rem;
    }

    .result-card .link:hover { text-decoration: underline; }

    .result-card .snippet {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      gap: 0.5rem;
      text-align: center;
    }

    .empty-state svg {
      opacity: 0.15;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 700px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <h1>g<span>O</span>ogle d<span>O</span>rking</h1>
  <span class="badge">GHDB / EXPLOIT-DB</span>
</header>

<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="field">
      <label>TARGET DOMAIN</label>
      <input type="text" id="domain" placeholder="example.com" autocomplete="off" spellcheck="false">
    </div>

    <button class="btn" id="btn-start" onclick="startSearch()">▶ RUN DORKS</button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopSearch()">■ STOP</button>

    <div class="stats">
      <div class="stat-box">
        <div class="num" id="stat-dorks">0</div>
        <div class="lbl">DORKS RAN</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-results">0</div>
        <div class="lbl">RESULTS</div>
      </div>
    </div>

    <div class="status-line" id="status">Awaiting target...</div>
  </aside>

  <!-- Results -->
  <section class="results-panel">
    <div class="results-toolbar">
      <span id="toolbar-count">0 results</span>
      <input class="filter-input" type="text" id="filter" placeholder="Filter results..." oninput="filterResults()">
    </div>
    <div id="results-list">
      <div class="empty-state" id="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <div>Enter a domain and run dorks</div>
        <div style="font-size:0.65rem;color:#2a3a4a">Results will stream here in real time</div>
      </div>
    </div>
  </section>

</div>

<script>
  let evtSource = null;
  let allCards = [];
  let dorkCount = 0;
  let resultCount = 0;

  function startSearch() {
    const domain = document.getElementById('domain').value.trim();
    if (!domain) {
      setStatus('error', 'Enter a domain first.');
      return;
    }

    // Reset
    allCards = [];
    dorkCount = 0;
    resultCount = 0;
    document.getElementById('stat-dorks').textContent = '0';
    document.getElementById('stat-results').textContent = '0';
    document.getElementById('results-list').innerHTML = '';
    document.getElementById('toolbar-count').textContent = '0 results';

    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').style.display = 'block';
    setStatus('active', '⟳ Connecting...');

    if (evtSource) evtSource.close();

    evtSource = new EventSource(`/search?domain=${encodeURIComponent(domain)}`);

    evtSource.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === 'dork') {
        dorkCount++;
        document.getElementById('stat-dorks').textContent = dorkCount;
        setStatus('active', data.dork);
      }

      else if (data.type === 'result') {
        resultCount++;
        document.getElementById('stat-results').textContent = resultCount;
        document.getElementById('toolbar-count').textContent = `${resultCount} result${resultCount !== 1 ? 's' : ''}`;
        addCard(data);
      }

      else if (data.type === 'done') {
        setStatus('done', `✓ Done — ${data.dorks} dorks, ${data.results} results`);
        cleanup();
      }

      else if (data.error) {
        setStatus('error', data.error);
        cleanup();
      }
    };

    evtSource.onerror = () => {
      setStatus('error', 'Stream error or server disconnected.');
      cleanup();
    };
  }

  function stopSearch() {
    if (evtSource) evtSource.close();
    setStatus('done', '■ Stopped by user.');
    cleanup();
  }

  function cleanup() {
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').style.display = 'none';
  }

  function addCard(data) {
    const list = document.getElementById('results-list');

    // Remove empty state if present
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    const card = document.createElement('div');
    card.className = 'result-card';
    card.dataset.text = `${data.title} ${data.link} ${data.snippet} ${data.dork}`.toLowerCase();
    card.innerHTML = `
      <div class="dork-tag">${escHtml(data.dork)}</div>
      <div class="title">${escHtml(data.title)}</div>
      <a class="link" href="${escHtml(data.link)}" target="_blank" rel="noopener">${escHtml(data.link)}</a>
      ${data.snippet ? `<div class="snippet">${escHtml(data.snippet)}</div>` : ''}
    `;

    allCards.push(card);
    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
    applyFilter();
  }

  function filterResults() {
    applyFilter();
  }

  function applyFilter() {
    const q = document.getElementById('filter').value.toLowerCase();
    let visible = 0;
    allCards.forEach(c => {
      const show = !q || c.dataset.text.includes(q);
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('toolbar-count').textContent =
      `${visible} result${visible !== 1 ? 's' : ''}${q ? ' (filtered)' : ''}`;
  }

  function setStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = `status-line ${type}`;
    el.innerHTML = type === 'active'
      ? `<span class="pulse"></span>${escHtml(msg)}`
      : escHtml(msg);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Allow Enter key to start
  document.getElementById('domain').addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });
</script>

</body>
</html>
